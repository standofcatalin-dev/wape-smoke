<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Game</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И НЕОНОВЫЙ ФОН --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            overflow: hidden; height: 100vh;
            background: linear-gradient(-45deg, #0a0a0f, #1a0033, #001a33, #0d001a, #000000);
            background-size: 400% 400%; animation: neonBackground 12s ease infinite;
            color: white;
        }
        @keyframes neonBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- ЭКРАН АВТОРИЗАЦИИ --- */
        #auth-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; transition: opacity 0.5s ease;
        }
        .auth-box {
            background: rgba(10, 10, 15, 0.7); padding: 40px; border-radius: 20px;
            border: 1px solid #00f2fe; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            width: 350px; text-align: center; backdrop-filter: blur(10px);
        }
        .auth-box h2 { margin-bottom: 20px; text-shadow: 0 0 10px #00f2fe; font-size: 1.8rem; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; margin-left: 5px; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: rgba(0,0,0,0.5); color: white; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: #ff2e63; box-shadow: 0 0 10px rgba(255, 46, 99, 0.5); }

        .btn {
            width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: bold; font-size: 1rem; transition: 0.3s; margin-top: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: #00f2fe; color: #000; box-shadow: 0 0 15px rgba(0,242,254,0.4); }
        .btn-primary:hover { background: #fff; box-shadow: 0 0 25px #00f2fe; transform: scale(1.02); }
        .btn-secondary { background: transparent; color: #ff2e63; border: 1px solid #ff2e63; margin-top: 15px; }
        .btn-secondary:hover { background: rgba(255, 46, 99, 0.1); box-shadow: 0 0 15px rgba(255,46,99,0.4); }

        /* --- ИГРОВОЙ ЭКРАН --- */
        #game-screen {
            display: none; 
            flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            position: relative;
        }
        
        /* Блок игрока (Ник, ID, Баланс) */
        .user-info { 
            position: absolute; top: 20px; right: 20px; 
            display: flex; flex-direction: column; align-items: flex-end;
            z-index: 100;
        }
        .player-stats {
            background: rgba(20, 20, 30, 0.9);
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            text-align: right;
            font-size: 0.9rem;
        }
        .player-stats span { color: #00f2fe; font-weight: bold; text-shadow: 0 0 10px #00f2fe; }
        
        .balance-box {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }
        #display-balance { color: #fff; text-shadow: 0 0 8px #ffd700; }
        
        .btn-logout { 
            background: transparent; border: 1px solid #555; color: #aaa; 
            padding: 8px 15px; border-radius: 5px; cursor: pointer; 
            font-size: 0.9rem; transition: 0.3s;
        }
        .btn-logout:hover { border-color: #ff2e63; color: #ff2e63; box-shadow: 0 0 10px rgba(255,46,99,0.3); }

        /* Кнопка магазина по центру */
        .shop-btn-center {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transition: 0.3s;
            margin-top: 20px;
        }
        .shop-btn-center:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 242, 254, 1);
        }

        /* Центральный текст игры */
        h1 { 
            font-size: 4rem; text-transform: uppercase; 
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe, 0 0 40px #ff2e63; 
            margin-bottom: 20px;
        }
        
        /* --- МАГАЗИН (МОДАЛЬНОЕ ОКНО) --- */
        #shop-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .shop-content {
            background: rgba(15, 15, 25, 0.95); padding: 30px; border-radius: 20px;
            border: 2px solid #00f2fe; box-shadow: 0 0 40px rgba(0, 242, 254, 0.3);
            width: 90%; max-width: 900px; position: relative;
        }
        .shop-content h2 { text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px #00f2fe; }
        .shop-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
        }
        .shop-item {
            background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px;
            border: 1px solid #333; text-align: center; transition: 0.3s;
        }
        .shop-item:hover { border-color: #ff2e63; box-shadow: 0 0 15px rgba(255,46,99,0.3); }
        .shop-item img {
            width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px;
            border: 1px solid #444;
        }
        .shop-item h3 { font-size: 1.1rem; margin-bottom: 5px; }
        .shop-item .price { color: #ffd700; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; text-shadow: 0 0 10px #ffd700; }
        .buy-skin-btn {
            background: #00f2fe; color: #000; border: none; padding: 8px 15px; border-radius: 5px;
            font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s;
        }
        .buy-skin-btn:hover { background: #fff; box-shadow: 0 0 15px #00f2fe; }
        
        .close-shop {
            position: absolute; top: 15px; right: 20px; font-size: 1.5rem;
            cursor: pointer; color: #ff2e63; transition: 0.3s;
        }
        .close-shop:hover { text-shadow: 0 0 10px #ff2e63; transform: scale(1.2); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВХОД / РЕГИСТРАЦИЯ -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Вход в игру</h2>
            
            <div class="input-group">
                <label>Ваш Никнейм</label>
                <input type="text" id="username" placeholder="Введите ник" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>

            <button class="btn btn-primary" id="main-btn" onclick="handleAuth()">Войти</button>
            <button class="btn btn-secondary" id="switch-btn" onclick="toggleAuthMode()">У меня нет аккаунта (Регистрация)</button>
        </div>
    </div>

    <!-- ЭКРАН 2: САМА ИГРА -->
    <div id="game-screen">
        <!-- Информация об игроке -->
        <div class="user-info">
            <div class="player-stats">
                <div>Игрок: <span id="display-name">...</span></div>
                <div>ID: <span id="display-id">...</span></div>
                <div class="balance-box">
                    💰 Баланс: <span id="display-balance">Загрузка...</span> GC
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
        
        <!-- Центральная часть -->
        <h1>Neon Game</h1>
        <p style="color:#aaa; margin-bottom: 10px;">Твой текущий скин: <span id="current-skin-name" style="color:#00f2fe; font-weight:bold;">Стандартный</span></p>
        
        <!-- Кнопка магазина прямо по центру -->
        <button class="shop-btn-center" onclick="openShop()">🛒 Магазин скинов</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО МАГАЗИНА -->
    <div id="shop-modal">
        <div class="shop-content">
            <span class="close-shop" onclick="closeShop()">✖</span>
            <h2>Неоновый Магазин</h2>
            <div class="shop-grid" id="shop-grid">
                <!-- Сюда JS сгенерирует товары -->
            </div>
        </div>
    </div>

    <script>
        // --- БАЗА ДАННЫХ МАГАЗИНА ---
        const shopItems = [
            { id: "skin1", name: "Скин 1 (Ф)", price: 5e99, img: "ф.jpg" },
            { id: "skin2", name: "Скин 2 (Ы)", price: 2e100, img: "ы.jpg" },
            { id: "skin3", name: "Скин 3 (А)", price: 5e100, img: "a.jpg" }
        ];

        let isLoginMode = true; 

        // Форматирование чисел
        function formatNumber(num) {
            if (num >= 1e6) return num.toExponential(2); 
            return num.toFixed(2);
        }

        // --- АВТОРИЗАЦИЯ ---
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("auth-title").innerText = isLoginMode ? "Вход в игру" : "Регистрация";
            document.getElementById("main-btn").innerText = isLoginMode ? "Войти" : "Создать аккаунт";
            document.getElementById("switch-btn").innerText = isLoginMode ? "У меня нет аккаунта (Регистрация)" : "Уже есть аккаунт (Вход)";
        }

        function handleAuth() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (!username || !password) return alert("Заполните все поля!");

            let usersDB = JSON.parse(localStorage.getItem("neon_users")) || {};

            if (isLoginMode) {
                const user = usersDB[username];
                if (!user) return alert("Такого игрока не существует!");
                if (user.password !== password) return alert("Неверный пароль!");
                loginSuccess(username, user.id);
            } else {
                if (usersDB[username]) return alert("Этот ник уже занят!");
                let newId = Date.now().toString().slice(-10);
                if (Object.values(usersDB).some(u => u.id === newId)) newId = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                
                usersDB[username] = { 
                    password: password, 
                    id: newId, 
                    balance: 1e100,
                    ownedSkins: [],
                    activeSkin: "Стандартный" 
                };
                localStorage.setItem("neon_users", JSON.stringify(usersDB));
                alert(`Аккаунт создан! Ваш ID: ${newId}`);
                loginSuccess(username, newId);
            }
        }

        function loginSuccess(username, id) {
            localStorage.setItem("neon_currentUser", JSON.stringify({ username, id }));
            const usersDB = JSON.parse(localStorage.getItem("neon_users")) || {};
            const user = usersDB[username];
            
            if (user.balance === undefined) user.balance = 1e100;
            if (!user.ownedSkins) user.ownedSkins = [];
            if (!user.activeSkin) user.activeSkin = "Стандартный";
            localStorage.setItem("neon_users", JSON.stringify(usersDB));

            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("game-screen").style.display = "flex";
            
            updateUI(username, user);
        }

        function updateUI(username, user) {
            document.getElementById("display-name").innerText = username;
            document.getElementById("display-id").innerText = user.id;
            document.getElementById("display-balance").innerText = formatNumber(user.balance);
            document.getElementById("current-skin-name").innerText = user.activeSkin;
        }

        function logout() {
            localStorage.removeItem("neon_currentUser");
            location.reload(); 
        }

        // --- МАГАЗИН ---
        function openShop() {
            renderShop();
            document.getElementById("shop-modal").style.display = "flex";
        }

        function closeShop() {
            document.getElementById("shop-modal").style.display = "none";
        }

        function renderShop() {
            const grid = document.getElementById("shop-grid");
            grid.innerHTML = "";
            
            const usersDB = JSON.parse(localStorage.getItem("neon_users")) || {};
            const currentUser = JSON.parse(localStorage.getItem("neon_currentUser"));
            const user = usersDB[currentUser.username];

            shopItems.forEach(item => {
                const isOwned = user.ownedSkins.includes(item.name);
                const isActive = user.activeSkin === item.name;

                grid.innerHTML += `
                    <div class="shop-item">
                        <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/200x150/1a0033/00f2fe?text=No+Image'">
                        <h3>${item.name}</h3>
                        <div class="price">${formatNumber(item.price)} GC</div>
                        <button class="buy-skin-btn" onclick="buySkin('${item.name}', ${item.price})" 
                            ${isActive ? 'disabled style="background:#555; cursor:not-allowed;"' : ''}>
                            ${isActive ? 'Активен' : (isOwned ? 'Выбрать' : 'Купить')}
                        </button>
                    </div>
                `;
            });
        }

        function buySkin(skinName, price) {
            const usersDB = JSON.parse(localStorage.getItem("neon_users")) || {};
            const currentUser = JSON.parse(localStorage.getItem("neon_currentUser"));
            const user = usersDB[currentUser.username];

            if (user.ownedSkins.includes(skinName)) {
                user.activeSkin = skinName;
                localStorage.setItem("neon_users", JSON.stringify(usersDB));
                updateUI(currentUser.username, user);
                renderShop();
                return;
            }

            if (user.balance < price) {
                return alert("Недостаточно средств!");
            }

            user.balance -= price;
            user.ownedSkins.push(skinName);
            user.activeSkin = skinName;
            localStorage.setItem("neon_users", JSON.stringify(usersDB));
            
            alert(`Успешно куплено: ${skinName}!`);
            updateUI(currentUser.username, user);
            renderShop();
        }

        window.onload = () => {
            const currentUser = JSON.parse(localStorage.getItem("neon_currentUser"));
            if (currentUser) {
                const usersDB = JSON.parse(localStorage.getItem("neon_users")) || {};
                if (usersDB[currentUser.username]) {
                    loginSuccess(currentUser.username, currentUser.id);
                }
            }
        };
    </script>
</body>
</html>
