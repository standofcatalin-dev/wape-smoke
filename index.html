<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon GTA 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; }
        canvas { display: block; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #00f2fe; font-family: 'Segoe UI', sans-serif;
            font-weight: bold; font-size: 1.5rem;
            text-shadow: 0 0 10px #00f2fe;
            pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>

    <div id="hud">
        🚗 Скорость: <span id="speed">0</span> км/ч
    </div>

    <!-- Подключаем Three.js (3D-движок) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Создаем сцену, камеру и рендерер
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02); // Туман для атмосферы

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510);
        document.body.appendChild(renderer.domElement);

        // 2. Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3); // Общий свет
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00f2fe, 1); // Неоновый синий свет
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff2e63, 1, 50); // Красный свет под машиной
        scene.add(pointLight);

        // 3. Создаем Машину (Группа из кубов)
        const car = new THREE.Group();

        // Корпус
        const bodyGeo = new THREE.BoxGeometry(2, 1, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x00f2fe, emissiveIntensity: 0.2 }); // Черный с легким свечением
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1;
        car.add(body);

        // Кабина
        const cabinGeo = new THREE.BoxGeometry(1.5, 0.8, 2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.y = 1.9;
        cabin.position.z = -0.2;
        car.add(cabin);

        // Неоновая подсветка (снизу)
        const underglowGeo = new THREE.PlaneGeometry(2.5, 4.5);
        const underglowMat = new THREE.MeshBasicMaterial({ color: 0xff2e63, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const underglow = new THREE.Mesh(underglowGeo, underglowMat);
        underglow.rotation.x = -Math.PI / 2;
        underglow.position.y = 0.05;
        car.add(underglow);

        scene.add(car);

        // 4. Создаем Мир (Бесконечная сетка города)
        // Сетка на земле
        const gridHelper = new THREE.GridHelper(200, 100, 0x00f2fe, 0x1a0033);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Земля (чтобы сетка не висела в воздухе)
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.1;
        scene.add(floor);

        // Генерируем рандомные неоновые здания вокруг
        const buildings = [];
        for (let i = 0; i < 50; i++) {
            const height = Math.random() * 15 + 5;
            const width = Math.random() * 4 + 2;
            const depth = Math.random() * 4 + 2;
            
            const bGeo = new THREE.BoxGeometry(width, height, depth);
            // Случайный неоновый цвет (фиолетовый, синий или розовый)
            const colors = [0x1a0033, 0x001a33, 0x0d001a];
            const bMat = new THREE.MeshStandardMaterial({ 
                color: colors[Math.floor(Math.random() * colors.length)],
                emissive: Math.random() > 0.5 ? 0x00f2fe : 0xff2e63,
                emissiveIntensity: 0.1
            });
            const b = new THREE.Mesh(bGeo, bMat);
            
            b.position.x = (Math.random() - 0.5) * 150;
            b.position.z = (Math.random() - 0.5) * 150;
            b.position.y = height / 2;
            
            scene.add(b);
            buildings.push(b);
        }

        // 5. Физика и Управление
        let carX = 0;
        let carZ = 0;
        let carRotation = 0;
        let carSpeed = 0;

        const maxSpeed = 0.5;
        const accel = 0.01;
        const friction = 0.95;
        const turnSpeed = 0.05;

        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.w = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.s = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.w = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.s = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.d = false;
        });

        // 6. Анимация (Игровой цикл)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Логика движения
            if (keys.w) carSpeed += accel;
            if (keys.s) carSpeed -= accel;
            
            // Ограничение скорости
            if (carSpeed > maxSpeed) carSpeed = maxSpeed;
            if (carSpeed < -maxSpeed/2) carSpeed = -maxSpeed/2;

            // Трение (машина замедляется сама)
            carSpeed *= friction;

            // Поворот (только если машина едет)
            if (Math.abs(carSpeed) > 0.01) {
                if (keys.a) carRotation += turnSpeed * (carSpeed > 0 ? 1 : -1);
                if (keys.d) carRotation -= turnSpeed * (carSpeed > 0 ? 1 : -1);
            }

            // Обновление позиции
            carX += Math.sin(carRotation) * carSpeed;
            carZ += Math.cos(carRotation) * carSpeed;

            // Применяем к 3D-модели
            car.position.x = carX;
            car.position.z = carZ;
            car.rotation.y = carRotation;

            // Обновляем HUD
            document.getElementById('speed').innerText = Math.round(Math.abs(carSpeed) * 200);

            // --- КАМЕРА ОТ ТРЕТЬЕГО ЛИЦА ---
            // Камера всегда висит сзади и чуть сверху
            const cameraOffset = new THREE.Vector3(0, 6, -12); // Смещение назад
            cameraOffset.applyQuaternion(car.quaternion); // Поворачиваем смещение вместе с машиной
            camera.position.lerp(car.position.clone().add(cameraOffset), 0.1); // Плавное следование
            camera.lookAt(car.position.x, car.position.y + 2, car.position.z);

            // Неоновая точка под машиной движется за ней
            pointLight.position.set(carX, 1, carZ);

            renderer.render(scene, camera);
        }

        // Обработка ресайза окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск
        animate();
    </script>
</body>
</html>
