<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Game</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И НЕОНОВЫЙ ФОН --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            overflow: hidden; height: 100vh;
            background: linear-gradient(-45deg, #0a0a0f, #1a0033, #001a33, #0d001a, #000000);
            background-size: 400% 400%; animation: neonBackground 12s ease infinite;
            color: white;
        }
        @keyframes neonBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- ЭКРАН АВТОРИЗАЦИИ --- */
        #auth-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; transition: opacity 0.5s ease;
        }
        .auth-box {
            background: rgba(10, 10, 15, 0.7); padding: 40px; border-radius: 20px;
            border: 1px solid #00f2fe; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            width: 350px; text-align: center; backdrop-filter: blur(10px);
        }
        .auth-box h2 { margin-bottom: 20px; text-shadow: 0 0 10px #00f2fe; font-size: 1.8rem; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; margin-left: 5px; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: rgba(0,0,0,0.5); color: white; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: #ff2e63; box-shadow: 0 0 10px rgba(255, 46, 99, 0.5); }

        .btn {
            width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: bold; font-size: 1rem; transition: 0.3s; margin-top: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: #00f2fe; color: #000; box-shadow: 0 0 15px rgba(0,242,254,0.4); }
        .btn-primary:hover { background: #fff; box-shadow: 0 0 25px #00f2fe; transform: scale(1.02); }
        .btn-secondary { background: transparent; color: #ff2e63; border: 1px solid #ff2e63; margin-top: 15px; }
        .btn-secondary:hover { background: rgba(255, 46, 99, 0.1); box-shadow: 0 0 15px rgba(255,46,99,0.4); }

        /* --- ИГРОВОЙ ЭКРАН --- */
        #game-screen {
            display: none; /* Появится после входа */
            flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            position: relative;
        }
        
        /* Блок игрока (Ник, ID, Баланс) */
        .user-info { 
            position: absolute; top: 20px; right: 20px; 
            display: flex; flex-direction: column; align-items: flex-end;
        }
        .player-stats {
            background: rgba(10, 10, 15, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
            text-align: right;
            font-size: 0.9rem;
        }
        .player-stats span { color: #00f2fe; font-weight: bold; text-shadow: 0 0 10px #00f2fe; }
        
        .balance-box {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #ffd700;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        #display-balance { color: #fff; text-shadow: 0 0 8px #ffd700; }
        
        .btn-logout { 
            background: transparent; border: 1px solid #555; color: #aaa; 
            padding: 5px 15px; border-radius: 5px; cursor: pointer; 
            font-size: 0.8rem; transition: 0.3s; 
        }
        .btn-logout:hover { border-color: #ff2e63; color: #ff2e63; box-shadow: 0 0 10px rgba(255,46,99,0.3); }

        /* Центральный текст игры */
        h1 { 
            font-size: 4rem; text-transform: uppercase; 
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe, 0 0 40px #ff2e63; 
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ВХОД / РЕГИСТРАЦИЯ -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Вход в игру</h2>
            
            <div class="input-group">
                <label>Ваш Никнейм</label>
                <input type="text" id="username" placeholder="Введите ник" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>

            <button class="btn btn-primary" id="main-btn" onclick="handleAuth()">Войти</button>
            <button class="btn btn-secondary" id="switch-btn" onclick="toggleAuthMode()">У меня нет аккаунта (Регистрация)</button>
        </div>
    </div>

    <!-- ЭКРАН 2: САМА ИГРА -->
    <div id="game-screen">
        <!-- Информация об игроке -->
        <div class="user-info">
            <div class="player-stats">
                <div>Игрок: <span id="display-name">...</span></div>
                <div>ID: <span id="display-id">...</span></div>
                <div class="balance-box">
                    💰 Баланс: <span id="display-balance">0.00</span> GC
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
        
        <!-- Центральная часть -->
        <h1>Neon Game</h1>
        <p style="margin-top:20px; color:#aaa;">Добро пожаловать на арену!</p>
    </div>

    <script>
        // --- ЛОГИКА АВТОРИЗАЦИИ И БАЗЫ ДАННЫХ ---
        
        let isLoginMode = true; 

        // Функция для красивого отображения чисел (если число больше миллиарда, показываем e+...)
        function formatNumber(num) {
            if (num >= 1e6) {
                // Превращает 1e100 в красивую строку "1e+100"
                return num.toExponential(2); 
            }
            return num.toFixed(2);
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById("auth-title");
            const mainBtn = document.getElementById("main-btn");
            const switchBtn = document.getElementById("switch-btn");

            if (isLoginMode) {
                title.innerText = "Вход в игру";
                mainBtn.innerText = "Войти";
                switchBtn.innerText = "У меня нет аккаунта (Регистрация)";
            } else {
                title.innerText = "Регистрация";
                mainBtn.innerText = "Создать аккаунт";
                switchBtn.innerText = "Уже есть аккаунт (Вход)";
            }
        }

        function handleAuth() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (!username || !password) {
                return alert("Заполните все поля!");
            }

            let usersDB = JSON.parse(localStorage.getItem("neon_users")) || {};

            if (isLoginMode) {
                const user = usersDB[username];
                if (!user) return alert("Такого игрока не существует!");
                if (user.password !== password) return alert("Неверный пароль!");

                loginSuccess(username, user.id);
            } else {
                if (usersDB[username]) return alert("Этот ник уже занят! Придумайте другой.");

                let newId = Date.now().toString().slice(-10);
                if (Object.values(usersDB).some(u => u.id === newId)) {
                    newId = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                }

                // ГУГОЛ! 1 и 100 нулей (1e100)
                const startBalance = 1e100; 

                // Сохраняем пользователя
                usersDB[username] = { password: password, id: newId, balance: startBalance };
                localStorage.setItem("neon_users", JSON.stringify(usersDB));

                alert(`Аккаунт создан! Ваш ID: ${newId}`);
                loginSuccess(username, newId);
            }
        }

        function loginSuccess(username, id) {
            localStorage.setItem("neon_currentUser", JSON.stringify({ username, id }));

            const usersDB = JSON.parse(localStorage.getItem("neon_users")) || {};
            const user = usersDB[username];
            
            // Если у старого аккаунта нет баланса, выдаем Гугол
            if (user.balance === undefined) {
                user.balance = 1e100;
                localStorage.setItem("neon_users", JSON.stringify(usersDB));
            }

            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("game-screen").style.display = "flex";
            
            document.getElementById("display-name").innerText = username;
            document.getElementById("display-id").innerText = id;
            
            // Выводим отформатированный баланс
            document.getElementById("display-balance").innerText = formatNumber(user.balance);
        }

        function logout() {
            localStorage.removeItem("neon_currentUser");
            location.reload(); 
        }

        window.onload = () => {
            const currentUser = JSON.parse(localStorage.getItem("neon_currentUser"));
            if (currentUser) {
                loginSuccess(currentUser.username, currentUser.id);
            }
        };
    </script>
</body>
</html>
