<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VapSolo 18K — Твой вкус</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Хедер -->
  <header>
    <h1 class="logo">Vap<span>Solo</span> <small>18K PUFFS</small></h1>
  </header>

  <!-- Фильтры -->
  <section class="filters">
    <button class="filter-btn active" data-category="all">Все</button>
    <button class="filter-btn" data-category="fruit">Фрукты</button>
    <button class="filter-btn" data-category="dessert">Десерты</button>
    <button class="filter-btn" data-category="drink">Напитки</button>
    <button class="filter-btn" data-category="ice">Лед</button>
  </section>

  <!-- Сетка товаров -->
  <section class="products" id="products">
    <!-- Карточки сгенерируем через JS -->
  </section>

  <!-- Корзина -->
  <div class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></div>

  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <h2>Ваша корзина</h2>
      <div id="cartItems"></div>
      <button id="checkoutBtn" class="checkout">Оформить заказ</button>
      <button id="closeCart" class="close">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
